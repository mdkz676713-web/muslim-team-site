<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Muslim Team</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0a0a0a;
    color:white;
}

header {
    display:flex;
    justify-content:space-between;
    padding:20px 40px;
    background:black;
}

.logo {
    font-size:22px;
    font-weight:600;
}

nav a {
    margin-left:20px;
    color:white;
    text-decoration:none;
}

.hero {
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right, black, #111);
    text-align:center;
}

.hero h1 {
    font-size:60px;
}

.btn {
    margin-top:20px;
    padding:15px 30px;
    background:cyan;
    color:black;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.products {
    display:flex;
    justify-content:center;
    gap:20px;
    padding:50px;
}

.card {
    background:#111;
    padding:20px;
    border-radius:10px;
    transition:0.3s;
}

.card:hover {
    transform:scale(1.05);
}

footer {
    text-align:center;
    padding:20px;
    color:#777;
}
</style>
</head>

<body>

<header>
    <div class="logo">MUSLIM TEAM</div>
    <nav>
        <a href="#">Accueil</a>
        <a href="#">Shop</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Muslim Team</h1>
    <p>Streetwear nouvelle génération</p>
    <button class="btn">Acheter maintenant</button>
</section>

<section class="products">
    <div class="card">
        <h3>Hoodie</h3>
        <p>Noir / Cyan</p>
    </div>

    <div class="card">
        <h3>Ensemble Tech</h3>
        <p>Edition limitée</p>
    </div>

    <div class="card">
        <h3>Pantalon</h3>
        <p>Confort premium</p>
    </div>
</section>

<footer>
    © 2026 Muslim Team | Insta/TikTok : mdkz80
</footer>

</body>
</html>
